{% extends 'base.html' %}{% block title %}New appointment | MediNexusAI{% endblock %}{% block content %}<div class="page-heading"><div><p class="eyebrow">Daily flow</p><h1>New appointment</h1><p>Set up a visit and keep the right people in the loop.</p></div></div><section class="form-card" style="max-width:720px"><form method="post" class="form-grid">{% csrf_token %}<label>Patient<select name="patient" required><option value="">Select patient</option>{% for patient in patients %}<option value="{{ patient.pk }}">{{ patient.full_name }}</option>{% endfor %}</select></label><label>Doctor<select name="doctor" required><option value="">Select doctor</option>{% for doctor in doctors %}<option value="{{ doctor.pk }}">Dr. {{ doctor.full_name }} · {{ doctor.specialization }}</option>{% endfor %}</select></label><div class="form-grid two"><label>Date<input name="appointment_date" type="date" required></label><label>Time<input name="appointment_time" type="time" required></label></div><label>Reason<textarea name="reason" required></textarea></label><button class="primary-btn" type="submit">Create appointment</button></form></section>{% endblock %}
