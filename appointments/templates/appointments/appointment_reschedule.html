{% extends 'base.html' %}{% block title %}Reschedule appointment | MediNexusAI{% endblock %}{% block content %}<div class="page-heading"><div><p class="eyebrow">Appointment #{{ appointment.appointment_id }}</p><h1>Reschedule appointment</h1><p>Choose a new time with Dr. {{ appointment.doctor.full_name }}.</p></div></div><section class="form-card" style="max-width:620px"><form method="post" class="form-grid">{% csrf_token %}<label>Date<input name="appointment_date" type="date" value="{{ appointment.appointment_date|date:'Y-m-d' }}" required></label><label>Available time<select name="appointment_time" required>{% for slot in available_slots %}<option value="{{ slot }}"{% if slot == appointment.appointment_time|time:'H:i' %} selected{% endif %}>{{ slot }}</option>{% empty %}<option disabled>No slots available</option>{% endfor %}</select></label><button class="primary-btn" type="submit">Save new time</button></form></section>{% endblock %}
