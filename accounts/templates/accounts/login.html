{% load static %}
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | medinexusai</title><link rel="stylesheet" href="{% static 'css/app.css' %}"><style>.login-page{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 80% 20%,#dff5f0,transparent 24rem),radial-gradient(circle at 10% 80%,#fff0df,transparent 22rem),var(--paper)}.login-card{width:min(430px,100%);padding:38px;background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);animation:rise .6s both}.login-card h1{margin:22px 0 8px;font-family:Georgia,serif;font-size:2.5rem}.login-card p{color:var(--muted);line-height:1.6}.login-card form{display:grid;gap:14px;margin-top:24px}.login-card label{color:var(--muted);font-size:.82rem;font-weight:700}.login-card input{display:block;width:100%;padding:13px;margin-top:6px;box-sizing:border-box;border:1px solid #d7dde7;border-radius:10px;font:inherit}</style></head>
<body><main class="login-page"><section class="login-card"><a class="brand" href="#"><span class="brand-mark">+</span><span>medinexusai</span></a><h1>Welcome back.</h1><p>Sign in to your clinical operations workspace.</p>{% if form.errors %}<p class="badge">Username or password is incorrect.</p>{% endif %}<form method="post">{% csrf_token %}<label>Username<input name="username" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="primary-btn" type="submit">Enter workspace</button></form></section></main></body></html>
