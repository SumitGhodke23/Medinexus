{% extends 'base.html' %}{% block title %}New medical record | MediNexusAI{% endblock %}{% block content %}<div class="page-heading"><div><p class="eyebrow">Clinical history</p><h1>New medical record</h1><p>Capture the clinical picture while it is still fresh.</p></div></div><section class="form-card" style="max-width:820px"><form method="post" class="form-grid">{% csrf_token %}<div class="form-grid two"><label>Patient<select name="patient" required><option value="">Select patient</option>{% for patient in patients %}<option value="{{ patient.pk }}">{{ patient.full_name }}</option>{% endfor %}</select></label><label>Doctor<select name="doctor"><option value="">Select doctor</option>{% for doctor in doctors %}<option value="{{ doctor.pk }}">Dr. {{ doctor.full_name }}</option>{% endfor %}</select></label></div><label>Disease<input name="disease" required></label><div class="form-grid two"><label>Symptoms<textarea name="symptoms"></textarea></label><label>Diagnosis<textarea name="diagnosis"></textarea></label><label>Treatment<textarea name="treatment"></textarea></label><label>Prescription<textarea name="prescription"></textarea></label></div><button class="primary-btn" type="submit">Save medical record</button></form></section>{% endblock %}
